&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;div class=&quot;wrap nav&quot;&gt;&lt;a class=&quot;brand&quot; href=&quot;#top&quot;&gt;&lt;strong&gt;PINAR&lt;/strong&gt;&lt;small&gt;KADIN SAĞLIĞI MERKEZİ&lt;/small&gt;&lt;/a&gt;&lt;nav class=&quot;menu&quot; aria-label=&quot;Ana menü&quot;&gt;&lt;a href=&quot;#yaklasim&quot;&gt;Yaklaşımımız&lt;/a&gt;&lt;a href=&quot;#hizmetler&quot;&gt;Hizmetler&lt;/a&gt;&lt;a href=&quot;#doktor&quot;&gt;Dr. Pınar&lt;/a&gt;&lt;a href=&quot;#iletisim&quot;&gt;İletişim&lt;/a&gt;&lt;a class=&quot;button nav-cta&quot; href=&quot;#iletisim&quot;&gt;Randevu Al&lt;/a&gt;&lt;/nav&gt;&lt;a class=&quot;mobile-toggle&quot; href=&quot;#iletisim&quot;&gt;RANDEVU&lt;/a&gt;&lt;/div&gt;&lt;/header&gt;&lt;main id=&quot;top&quot;&gt;&lt;section class=&quot;wrap hero&quot;&gt;&lt;div class=&quot;hero-copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Bilimsel, zarif ve bütünsel&lt;/div&gt;&lt;h1&gt;Kadın sağlığında &lt;em&gt;özenli&lt;/em&gt; bir yaklaşım.&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;Yaşamın her döneminde, güncel tıbbı sakin ve kişiye özel bir bakım deneyimiyle buluşturuyoruz.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;button primary&quot; href=&quot;#iletisim&quot;&gt;Randevu oluştur&lt;/a&gt;&lt;a class=&quot;button secondary&quot; href=&quot;#yaklasim&quot;&gt;Yaklaşımımız&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hero-photo&quot; role=&quot;img&quot; aria-label=&quot;Dr. Pınar&quot;&gt;&lt;div class=&quot;round-note&quot;&gt;Her kadın kendine özgü.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;yaklasim&quot; class=&quot;section manifesto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;manifesto-grid&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Felsefemiz&lt;/div&gt;&lt;h2&gt;İyi bakım, dinlemekle başlar.&lt;/h2&gt;&lt;/div&gt;&lt;blockquote&gt;“Tıbbi bilgiyi, kişinin yaşamını ve beklentilerini anlayan sakin bir iletişimle bir araya getiriyoruz.”&lt;/blockquote&gt;&lt;/div&gt;&lt;div class=&quot;principles&quot;&gt;&lt;article class=&quot;principle&quot;&gt;&lt;b&gt;Mahremiyet&lt;/b&gt;&lt;p&gt;Her görüşme ve tedavi süreci güvenli, sakin ve saygılı bir ortamda ilerler.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;principle&quot;&gt;&lt;b&gt;Bilimsellik&lt;/b&gt;&lt;p&gt;Tanı ve tedavi kararları güncel, kanıta dayalı tıp yaklaşımıyla şekillenir.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;principle&quot;&gt;&lt;b&gt;Kişiye özel bakım&lt;/b&gt;&lt;p&gt;Standart çözümler yerine ihtiyaçlara ve yaşam dönemine uygun bir yol haritası hazırlanır.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;hizmetler&quot; class=&quot;section services&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Bakım alanları&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Yaşamın her döneminde yanınızda.&lt;/h2&gt;&lt;div class=&quot;service-grid&quot;&gt;&lt;article class=&quot;service&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;Koruyucu kadın sağlığı&lt;/h3&gt;&lt;p&gt;Rutin kontroller, taramalar ve kişisel sağlık planlaması.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;service&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;Gebelik ve doğum&lt;/h3&gt;&lt;p&gt;Gebelik takibi, doğum planlaması ve doğum sonrası bakım.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;service&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;Jinekolojik cerrahi&lt;/h3&gt;&lt;p&gt;Güncel tekniklerle tanı, değerlendirme ve cerrahi çözümler.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;service&quot;&gt;&lt;span&gt;04&lt;/span&gt;&lt;h3&gt;Ürojinekoloji&lt;/h3&gt;&lt;p&gt;Pelvik taban sağlığı ve idrar kaçırma değerlendirmeleri.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;service&quot;&gt;&lt;span&gt;05&lt;/span&gt;&lt;h3&gt;Menopoz yönetimi&lt;/h3&gt;&lt;p&gt;Yaşam kalitesini merkeze alan kişiselleştirilmiş takip.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;service&quot;&gt;&lt;span&gt;06&lt;/span&gt;&lt;h3&gt;Genital bölge sağlığı&lt;/h3&gt;&lt;p&gt;Mahremiyet ve doğru bilgilendirme odaklı danışmanlık.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;doktor&quot; class=&quot;section doctor&quot;&gt;&lt;div class=&quot;wrap doctor-grid&quot;&gt;&lt;div class=&quot;doctor-photo&quot; role=&quot;img&quot; aria-label=&quot;Dr. Pınar portresi&quot;&gt;&lt;/div&gt;&lt;div class=&quot;doctor-copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Dr. Pınar&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Bilimsel titizlik, insani sıcaklık.&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Dr. Pınar, kadın sağlığını yalnızca bir tedavi alanı değil; doğru bilgi, güvenli iletişim ve uzun süreli takip gerektiren bütünsel bir süreç olarak ele alır.&lt;/p&gt;&lt;p&gt;Bu bölümde eğitim, uzmanlık, klinik deneyim ve üyelik bilgileri yer alacaktır.&lt;/p&gt;&lt;div class=&quot;signature&quot;&gt;Dr. Pınar&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;iletisim&quot; class=&quot;section contact&quot;&gt;&lt;div class=&quot;wrap contact-grid&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Randevu ve iletişim&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Sizi dinlemek için buradayız.&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Formu doldurun, ekibimiz uygun randevu seçenekleri için sizinle iletişime geçsin.&lt;/p&gt;&lt;p&gt;Adres: Klinik adresi buraya eklenecek&lt;br&gt;Telefon: 0 (5xx) xxx xx xx&lt;br&gt;E-posta: bilgi@drpinar.com&lt;/p&gt;&lt;/div&gt;&lt;form class=&quot;form&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;Ad Soyad&quot; placeholder=&quot;Ad Soyad&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;Telefon&quot; placeholder=&quot;Telefon&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;E-posta&quot; placeholder=&quot;E-posta&quot;&gt;&lt;textarea class=&quot;field&quot; aria-label=&quot;Mesaj&quot; placeholder=&quot;Kısa mesajınız&quot;& gereğinden fazla kaygı yaratabildiğine inanıyorum. Oysa kadın sağlığıyla ilgili pek çok süreç doğru bilgi, düzenli takip ve uygun tedaviyle güvenle yönetilebilir.&lt;/p&gt;&lt;p&gt;Bu nedenle değerlendirmelerde yalnızca riskleri değil; kişinin yaşamını, beklentilerini ve bedenin doğal dengesini de dikkate alıyorum.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;timeline&quot;&gt;&lt;article&gt;&lt;b&gt;Açık iletişim&lt;/b&gt;&lt;span&gt;ANLAŞILIR BİLGİLENDİRME&lt;/span&gt;&lt;/article&gt;&lt;article&gt;&lt;b&gt;Birlikte karar&lt;/b&gt;&lt;span&gt;KİŞİYE ÖZEL PLANLAMA&lt;/span&gt;&lt;/article&gt;&lt;article&gt;&lt;b&gt;Süreklilik&lt;/b&gt;&lt;span&gt;UZUN DÖNEMLİ TAKİP&lt;/span&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;uzmanlik&quot; class=&quot;section expertise&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Uzmanlık alanları&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Kapsamlı değerlendirme, sade anlatım.&lt;/h2&gt;&lt;div class=&quot;expert-list&quot;&gt;&lt;article class=&quot;expert&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;İnfertilite ve üreme sağlığı&lt;/h3&gt;&lt;p&gt;Değerlendirme, takip ve kişiselleştirilmiş tedavi planı&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;expert&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;Jinekolojik endoskopik cerrahi&lt;/h3&gt;&lt;p&gt;Laparoskopik ve histeroskopik yöntemler&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;expert&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;Menopoz tedavisi ve takibi&lt;/h3&gt;&lt;p&gt;Yaşam kalitesi ve koruyucu sağlık odağı&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;expert&quot;&gt;&lt;span&gt;04&lt;/span&gt;&lt;h3&gt;Ürojinekoloji&lt;/h3&gt;&lt;p&gt;Pelvik taban ve idrar kaçırma tedavileri&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;expert&quot;&gt;&lt;span&gt;05&lt;/span&gt;&lt;h3&gt;Gebelik takibi ve doğum&lt;/h3&gt;&lt;p&gt;Gebeliğin her döneminde düzenli takip&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;expert&quot;&gt;&lt;span&gt;06&lt;/span&gt;&lt;h3&gt;Jinekolojik kanser taramaları&lt;/h3&gt;&lt;p&gt;Erken tanı ve düzenli kontrol planlaması&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;hakkimda&quot; class=&quot;section about&quot;&gt;&lt;div class=&quot;wrap about-grid&quot;&gt;&lt;div class=&quot;about-photo&quot; role=&quot;img&quot; aria-label=&quot;Dr. Pınar portresi&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Dr. Pınar&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Deneyim, açıklık ve ölçülü yaklaşım.&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Bu alanda eğitim, uzmanlık ve klinik deneyim bilgileri yer alacaktır. Metin; doktorun gerçek özgeçmişi ve uzmanlık odağına göre düzenlenmelidir.&lt;/p&gt;&lt;p&gt;Muayenede amaç, kişiyi acele ettirmeden dinlemek; tıbbi seçenekleri artıları ve sınırlarıyla anlatmak; izlenecek yolu birlikte belirlemektir.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;iletisim&quot; class=&quot;section contact&quot;&gt;&lt;div class=&quot;wrap contact-grid&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;İletişim&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Randevunuzu planlayın.&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Sorularınız ve randevu talepleriniz için formu kullanabilir veya kliniğe doğrudan ulaşabilirsiniz.&lt;/p&gt;&lt;p&gt;Adres: Klinik adresi buraya eklenecek&lt;br&gt;Telefon: 0 (5xx) xxx xx xx&lt;br&gt;E-posta: bilgi@drpinar.com&lt;/p&gt;&lt;/div&gt;&lt;form class=&quot;contact-panel&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;Ad Soyad&quot; placeholder=&quot;Ad Soyad&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;Telefon&quot; placeholder=&quot;Telefon&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;E-posta&quot; placeholder=&quot;E-posta&quot;&gt;&lt;textarea class=&quot;field&quot; aria-label=&quot;Mesaj&quot; placeholder=&quot;Mesajınız&quot;&gt;&lt;/textarea&gt;&lt;button class=&quot;button&quot; type=&quot;button&quot; style=&quot;background:#20352e;color:white;margin-top:22px&quot;&gt;Talep gönder&lt;/button&gt;&lt;/form&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer class=&quot;footer&quot;&gt;&lt;div class=&quot;wrap footer-row&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;strong&gt;Dr. Pınar&lt;/strong&gt;&lt;small&gt;KADIN SAĞLIĞI VE DOĞUM&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;muted&quot;&gt;Bilgilendirme amaçlı örnek web sitesi tasarımıdır.&lt;/div&gt;&lt;/div&gt;&lt;/footer&gt;&lt;script&gt;document.querySelectorAll(&#x27;a[href^=&quot;#&quot;]&#x27;).forEach(function(link){link.addEventListener(&#x27;click&#x27;,function(event){var selector=link.getAttribute(&#x27;href&#x27;);var target=document.querySelector(selector);if(target){event.preventDefault();target.scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;start&#x27;});}});});&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;div class=&quot;wrap nav&quot;&gt;&lt;a class=&quot;brand&quot; href=&quot;#top&quot;&gt;&lt;strong&gt;pınar &lt;i&gt;kadın sağlığı&lt;/i&gt;&lt;/strong&gt;&lt;small&gt;KADIN SAĞLIĞI VE DOĞUM KLİNİĞİ&lt;/small&gt;&lt;/a&gt;&lt;nav class=&quot;menu&quot; aria-label=&quot;Ana menü&quot;&gt;&lt;a href=&quot;#bakim&quot;&gt;Bakım alanları&lt;/a&gt;&lt;a href=&quot;#programlar&quot;&gt;Programlar&lt;/a&gt;&lt;a href=&quot;#doktor&quot;&gt;Dr. Pınar&lt;/a&gt;&lt;a href=&quot;#iletisim&quot;&gt;İletişim&lt;/a&gt;&lt;a class=&quot;button nav-cta&quot; href=&quot;#iletisim&quot;&gt;Randevu Al&lt;/a&gt;&lt;/nav&gt;&lt;a class=&quot;mobile-toggle&quot; href=&quot;#iletisim&quot;&gt;RANDEVU&lt;/a&gt;&lt;/div&gt;&lt;/header&gt;&lt;main id=&quot;top&quot;&gt;&lt;section class=&quot;hero&quot;&gt;&lt;div class=&quot;hero-copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Kadınlığın her döneminde&lt;/div&gt;&lt;h1&gt;Kendiniz gibi hissedeceğiniz bir sağlık deneyimi.&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;Ergenlikten menopoza, gebelikten koruyucu sağlığa; her adımda anlaşılır, sıcak ve bilimsel bakım.&lt;/p&gt;&lt;div class=&quot;hero-actions&quot;&gt;&lt;a class=&quot;button primary&quot; href=&quot;#iletisim&quot;&gt;Randevu oluştur&lt;/a&gt;&lt;a class=&quot;text-link&quot; href=&quot;#bakim&quot;&gt;Bakım alanlarını keşfet&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hero-photo&quot; role=&quot;img&quot; aria-label=&quot;Dr. Pınar&quot;&gt;&lt;div class=&quot;listen-card&quot;&gt;&lt;b&gt;Sizi dinleyerek başlıyoruz.&lt;/b&gt;&lt;span&gt;İlk görüşme ve kişisel değerlendirme&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;bakim&quot; class=&quot;section journey&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;journey-intro&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Yaşam boyu kadın sağlığı&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Her döneme özel bakım.&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;Kadın sağlığını yalnızca belirtiler üzerinden değil; yaşam evresi, beklentiler ve genel iyilik haliyle birlikte ele alıyoruz.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;stage-grid&quot;&gt;&lt;article class=&quot;stage&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Genç kadın sağlığı&lt;/h3&gt;&lt;p&gt;İlk kontroller, döngü sağlığı ve doğru bilgilendirme.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;stage&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Gebelik ve doğum&lt;/h3&gt;&lt;p&gt;Gebelik öncesinden doğum sonrasına bütüncül takip.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;stage&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Hormon dengesi&lt;/h3&gt;&lt;p&gt;Döngü, PCOS ve hormonal değişimlerin yönetimi.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;stage&quot;&gt;&lt;span&gt;04&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Menopoz dönemi&lt;/h3&gt;&lt;p&gt;Güçlü, dengeli ve sağlıklı bir yeni dönem için destek.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;programlar&quot; class=&quot;section programs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Özel bakım programları&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Tek bir işlem değil, düşünülmüş bir süreç.&lt;/h2&gt;&lt;div class=&quot;program-list&quot;&gt;&lt;article class=&quot;program&quot;&gt;&lt;small&gt;GEBELİK SÜRECİ&lt;/small&gt;&lt;div&gt;&lt;h3&gt;Doğuma hazırlık ve takip&lt;/h3&gt;&lt;p&gt;Kontrolleri, doğum tercihlerini ve doğum sonrası ihtiyaçları birlikte planlayan bakım modeli.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;program&quot;&gt;&lt;small&gt;HORMON SAĞLIĞI&lt;/small&gt;&lt;div&gt;&lt;h3&gt;Denge programı&lt;/h3&gt;&lt;p&gt;Belirtileri, yaşam biçimini ve tıbbi bulguları birlikte değerlendiren kişisel takip.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;program&quot;&gt;&lt;small&gt;PELViK SAĞLIK&lt;/small&gt;&lt;div&gt;&lt;h3&gt;Pelvik taban değerlendirmesi&lt;/h3&gt;&lt;p&gt;İdrar kaçırma ve pelvik taban sorunlarında mahremiyet odaklı yaklaşım.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;program&quot;&gt;&lt;small&gt;KORUYUCU SAĞLIK&lt;/small&gt;&lt;div&gt;&lt;h3&gt;Yıllık kadın sağlığı planı&lt;/h3&gt;&lt;p&gt;Yaşa ve kişisel risklere göre tarama, kontrol ve takip takvimi.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;doktor&quot; class=&quot;section doctor&quot;&gt;&lt;div class=&quot;wrap doctor-grid&quot;&gt;&lt;div class=&quot;doctor-photo&quot; role=&quot;img&quot; aria-label=&quot;Dr. Pınar portresi&quot;&gt;&lt;/div&gt;&lt;div class=&quot;doctor-copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Dr. Pınar&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Her kadının hikâyesi özeldir. Sağlığı da öyle.&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Bilimsel yaklaşımı, deneyimi ve özenli iletişimi bir araya getiren kişiselleştirilmiş kadın sağlığı bakımı.&lt;/p&gt;&lt;p&gt;Bu bölüm doktorun gerçek eğitimi, uzmanlık alanları, klinik deneyimi ve yaklaşımıyla güncellenecektir.&lt;/p&gt;&lt;div class=&quot;qualities&quot;&gt;&lt;div class=&quot;quality&quot;&gt;&lt;b&gt;Bilimsel ve güncel&lt;/b&gt;&lt;p&gt;Kanıta dayalı değerlendirme&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;quality&quot;&gt;&lt;b&gt;Kişiye özel&lt;/b&gt;&lt;p&gt;Özgün tedavi yol haritası&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;quality&quot;&gt;&lt;b&gt;Gizlilik ve güven&lt;/b&gt;&lt;p&gt;Mahremiyete saygılı süreç&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;quality&quot;&gt;&lt;b&gt;Özenli deneyim&lt;/b&gt;&lt;p&gt;Sakin ve anlaşılır iletişim&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;iletisim&quot; class=&quot;section contact&quot;&gt;&lt;div class=&quot;wrap contact-grid&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Randevu ve iletişim&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Sorularınızı birlikte değerlendirelim.&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Randevu talebinizi iletin; ekibimiz uygun gün ve saat seçenekleriyle sizinle iletişime geçsin.&lt;/p&gt;&lt;p&gt;Adres: Klinik adresi buraya eklenecek&lt;br&gt;Telefon: 0 (5xx) xxx xx xx&lt;br&gt;E-posta: bilgi@drpinar.com&lt;/p&gt;&lt;/div&gt;&lt;form class=&quot;contact-box&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;Ad Soyad&quot; placeholder=&quot;Ad Soyad&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;Telefon&quot; placeholder=&quot;Telefon&quot;&gt;&lt;input class=&quot;field&quot; aria-label=&quot;E-posta&quot; placeholder=&quot;E-posta&quot;&gt;&lt;textarea class=&quot;field&quot; aria-label=&quot;Mesaj&quot; placeholder=&quot;Kısa mesajınız&quot;&gt;&lt;/textarea&gt;&lt;button class=&quot;button primary&quot; type=&quot;button&quot; style=&quot;margin-top:24px&quot;&gt;Randevu talebi gönder&lt;/button&gt;&lt;/form&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer class=&quot;footer&quot;&gt;&lt;div class=&quot;wrap footer-row&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;strong&gt;pınar &lt;i&gt;kadın sağlığı&lt;/i&gt;&lt;/strong&gt;&lt;small&gt;KADIN SAĞLIĞI VE DOĞUM KLİNİĞİ&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;muted&quot;&gt;Bilgilendirme amaçlı örnek web sitesi tasarımıdır.&lt;/div&gt;&lt;/div&gt;&lt;/footer&gt;&lt;script&gt;document.querySelectorAll(&#x27;a[href^=&quot;#&quot;]&#x27;).forEach(function(link){link.addEventListener(&#x27;click&#x27;,function(event){var selector=link.getAttribute(&#x27;href&#x27;);var target=document.querySelector(selector);if(target){event.preventDefault();target.scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;start&#x27;});}});});&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
